<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gorex video preview</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#000;overflow:hidden}</style>
</head>
<body>
  <iframe id="video" title="YouTube video preview" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/__VIDEO_ID__?start=__START__&amp;autoplay=1&amp;enablejsapi=1&amp;controls=1&amp;rel=0&amp;origin=__ORIGIN__"></iframe>
  <script>
    const video = document.getElementById('video');
    window.addEventListener('message', (event) => {
      if (event.source === window.parent && ['tauri://localhost', 'http://tauri.localhost', 'http://127.0.0.1:1420'].includes(event.origin)) {
        if (event.data && event.data.type === 'gorex-seek' && Number.isFinite(event.data.seconds)) {
          video.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [Math.max(0, event.data.seconds), true] }), 'https://www.youtube-nocookie.com');
        }
      } else if (event.source === video.contentWindow && ['https://www.youtube.com', 'https://www.youtube-nocookie.com'].includes(event.origin)) {
        window.parent.postMessage(event.data, '*');
      }
    });
  </script>
</body>
</html>
