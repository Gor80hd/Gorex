[package]
name = "gorex"
version = "3.0.0"
description = "Gorex video converter and downloader"
authors = ["Akhmatyarov"]
license = "MIT"
repository = "https://github.com/Gor80hd/Gorex"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gorex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "fs", "net"] }
base64 = "0.22"
axum = "0.8"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
time = { version = "0.3", features = ["formatting"] }
sha2 = "0.10"
