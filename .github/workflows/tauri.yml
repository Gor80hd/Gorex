name: Tauri desktop

on:
  push:
    branches: ["codex/Tauri2"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            bundle: dmg
            artifact: gorex-macos-arm64
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - runner: windows-2022
            bundle: nsis
            artifact: gorex-windows-x64
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run prepare:tauri-binaries
      - run: node scripts/smoke-tauri-media-tools.mjs
      - run: npm run typecheck
      - run: node --test test/*.test.mjs
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run build:tauri -- --bundles ${{ matrix.bundle }}
      - run: pwsh -NoProfile -File scripts/smoke-windows-installer.ps1
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
